name: Build and deploy Asli Olan Duzen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate browser JavaScript
        run: |
          node --check assets/js/main.js
          node --check assets/js/gallery.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site and discover archive files
        run: python scripts/build_site.py

      - name: Persist generated archive and gallery data for branch previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archives.json gallery.json
          if ! git diff --cached --quiet; then
            git commit -m "Update generated archive and gallery data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify generated public data
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          archives = json.loads(Path("dist/archives.json").read_text(encoding="utf-8"))
          gallery = json.loads(Path("dist/gallery.json").read_text(encoding="utf-8"))
          html = Path("dist/index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="application/json" id="archive-data">(.*?)</script>', html, re.S)
          assert match, "index.html içinde gömülü arşiv verisi bulunamadı"
          embedded = json.loads(match.group(1))
          assert len(archives.get("categories", [])) > 0, "Arşiv kategorisi yok"
          assert len(gallery.get("images", [])) > 0, "Galeri görseli yok"
          assert len(embedded.get("categories", [])) == len(archives["categories"]), "Gömülü arşiv verisi ile JSON uyuşmuyor"
          print(f"Verified: {len(archives['categories'])} archive categories, {len(gallery['images'])} gallery images")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
