name: Build and deploy Asli Olan Duzen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate archive publication rules
        run: python -m unittest discover -s tests -v

      - name: Validate browser JavaScript
        run: |
          node --check assets/js/main.js
          node --check assets/js/gallery.js
          node --check assets/js/audio.js
          node --check assets/js/site-search.js
          node --check assets/js/file-center.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site and discover archive files
        run: python scripts/build_site.py

      - name: Persist generated archive and gallery data for branch previews
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archives.json gallery.json videos.json audio.json
          if ! git diff --cached --quiet; then
            git commit -m "Update generated archive and gallery data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify generated public data
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          archives = json.loads(Path("dist/archives.json").read_text(encoding="utf-8"))
          gallery = json.loads(Path("dist/gallery.json").read_text(encoding="utf-8"))
          videos = json.loads(Path("dist/videos.json").read_text(encoding="utf-8"))
          audio = json.loads(Path("dist/audio.json").read_text(encoding="utf-8"))
          html = Path("dist/index.html").read_text(encoding="utf-8")
          assert Path("dist/404.html").is_file(), "Özel 404 sayfası dist içine kopyalanmadı"
          assert Path("dist/assets/js/site-search.js").is_file(), "Merkezî arama betiği bulunamadı"
          for page in ("index.html", "galeri.html", "sesler.html", "dosya-merkezi.html"):
              page_html = Path("dist") / page
              assert page_html.is_file(), "Sayfa bulunamadı: " + page
              source = page_html.read_text(encoding="utf-8")
              assert 'rel="canonical"' in source, "Canonical URL eksik: " + page
              assert "site-search.js" in source, "Merkezî arama yüklenmiyor: " + page
          match = re.search(r'<script type="application/json" id="archive-data">(.*?)</script>', html, re.S)
          assert match, "index.html içinde gömülü arşiv verisi bulunamadı"
          embedded = json.loads(match.group(1))
          category_ids = {category.get("id") for category in archives.get("categories", [])}
          assert {"geography", "society", "media", "documents"}.issubset(category_ids), "Yeni arşiv birimleri eksik"
          assert Path("dist/required-files.json").is_file(), "Gerekli dosyalar envanteri bulunamadı"
          assert Path("dist/assets/css/file-center.css").is_file(), "Dosya merkezi stili bulunamadı"
          assert Path("dist/assets/js/file-center.js").is_file(), "Dosya merkezi betiği bulunamadı"
          assert Path("dist/GerekliDosyalar/00-OKUMA-REHBERI.md").is_file(), "Şablon rehberi bulunamadı"
          assert len(archives.get("categories", [])) > 0, "Arşiv kategorisi yok"
          assert len(gallery.get("images", [])) > 0, "Galeri görseli yok"
          assert isinstance(videos.get("videos", []), list), "Video kataloğu geçersiz"
          assert isinstance(audio.get("audio", []), list), "Ses kataloğu geçersiz"
          for video in videos.get("videos", []):
              video_path = Path("dist") / video["src"]
              assert video_path.is_file(), "Video dosyası bulunamadı: " + video["src"]
              if video.get("poster"):
                  poster_path = Path("dist") / video["poster"]
                  assert poster_path.is_file(), "Video kapağı bulunamadı: " + video["poster"]
          for record in audio.get("audio", []):
              audio_path = Path("dist") / record["src"]
              assert audio_path.is_file(), "Ses dosyası bulunamadı: " + record["src"]
          assert len(embedded.get("categories", [])) == len(archives["categories"]), "Gömülü arşiv verisi ile JSON uyuşmuyor"
          print(f"Verified: {len(archives['categories'])} archive categories, {len(gallery['images'])} gallery images, {len(videos.get('videos', []))} videos, {len(audio.get('audio', []))} audio records")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
